
<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HR Compass | 人事データ分析</title>
<style>
:root{--bg:#f4f6fa;--card:#fff;--ink:#182338;--muted:#718096;--blue:#365cf5;--line:#e7ebf2}
*{box-sizing:border-box}
body{margin:0;font-family:Arial,"Noto Sans JP",sans-serif;background:var(--bg);color:var(--ink)}
.layout{display:flex;min-height:100vh}
aside{width:235px;background:#172238;color:white;padding:26px 15px;flex-shrink:0}
.logo{font-size:21px;font-weight:800;padding:0 12px 28px}.logo span{color:#85a0ff}
.nav{padding:13px 14px;border-radius:9px;margin:5px 0;cursor:pointer;color:#c5cee0}
.nav.active,.nav:hover{background:#2b3a59;color:white}
main{flex:1;padding:30px;min-width:0}
header{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:26px}
h1{font-size:27px;margin:0 0 7px}p{color:var(--muted);margin:0;font-size:13px}
.tag{background:#e6edff;color:#365cf5;border-radius:20px;padding:7px 12px;font-size:12px}
.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:15px;margin-bottom:20px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:20px;min-width:0}
.metric-label{color:var(--muted);font-size:13px}.metric{font-size:28px;font-weight:800;margin:12px 0 8px}.up{color:#16866b;font-size:12px}
.section-grid{display:grid;grid-template-columns:1.2fr 1fr;gap:18px;margin-bottom:20px}
h2{font-size:16px;margin:0 0 20px}
.barrow{margin:15px 0}.barlabel{display:flex;justify-content:space-between;font-size:12px;margin-bottom:7px}.bar{height:8px;background:#edf0f6;border-radius:8px;overflow:hidden}.fill{height:100%;background:var(--blue);border-radius:8px}
table{width:100%;border-collapse:collapse;font-size:13px}th,td{text-align:left;padding:13px 10px;border-bottom:1px solid var(--line);white-space:nowrap}th{color:var(--muted);font-weight:500} .tablewrap{overflow:auto}
.pill{background:#e7f7ef;color:#17805d;border-radius:20px;padding:5px 9px;font-size:11px}
button{border:0;background:var(--blue);color:white;padding:10px 14px;border-radius:8px;cursor:pointer;font-weight:600}
button.secondary{background:#edf1ff;color:#365cf5}
input,select{padding:10px;border:1px solid var(--line);border-radius:8px;background:white;color:var(--ink);max-width:100%}
.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:15px}
.small{font-size:12px;color:var(--muted);line-height:1.7}
.empty{padding:28px;text-align:center;color:var(--muted)}
@media(max-width:1000px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.section-grid{grid-template-columns:1fr}}
@media(max-width:650px){aside{width:65px;padding:20px 6px}.logo{font-size:0;padding:0 8px 22px}.logo span{font-size:21px}.nav{font-size:0;text-align:center;padding:14px 3px}.nav:first-letter{font-size:17px}main{padding:17px 12px}.grid{gap:8px}.card{padding:13px}.metric{font-size:22px}h1{font-size:22px}}
</style>
</head>
<body>
<div class="layout">
<aside>
<div class="logo">HR <span>Compass.</span></div>
<div class="nav active" data-page="dashboard">▦　ダッシュボード</div>
<div class="nav" data-page="jobs">▤　求人管理</div>
<div class="nav" data-page="recruit">◎　採用チャネル分析</div>
<div class="nav" data-page="people">♙　社員データ</div>
<div class="nav" data-page="retention">↗　組織・定着分析</div>
<div class="nav" data-page="ai">✳　AI入力センター</div>
<div style="margin:28px 12px 0;color:#8f9db7;font-size:11px;line-height:1.8">PROTOTYPE 0.1<br>すべて架空のデータです</div>
</aside>
<main>
<header>
<div><h1 id="title">人事ダッシュボード</h1><p id="subtitle">採用から定着・成長まで、組織の状態を見える化</p></div>
<span class="tag">● デモデータ</span>
</header>
<div id="content"></div>
</main>
</div>
<script>
const employees=[
{id:"E001",name:"山田 花子",dept:"営業",role:"マネージャー",tenure:"4年2か月",source:"中途",rating:"A",salary:520,trend:[3,4,4,5]},
{id:"E002",name:"佐藤 太郎",dept:"人事",role:"採用担当",tenure:"2年1か月",source:"中途",rating:"B",salary:430,trend:[3,3,4,4]},
{id:"E003",name:"鈴木 美咲",dept:"開発",role:"エンジニア",tenure:"1年4か月",source:"新卒",rating:"A",salary:480,trend:[3,4,4,5]},
{id:"E004",name:"田中 健",dept:"営業",role:"メンバー",tenure:"8か月",source:"中途",rating:"B",salary:390,trend:[3,3,3,4]},
{id:"E005",name:"高橋 葵",dept:"人事",role:"人材開発",tenure:"3年6か月",source:"中途",rating:"A",salary:500,trend:[3,4,4,5]}
];
const jobs=[
{title:"法人営業",dept:"営業",channel:"求人媒体A",period:"2026/09–10",count:2,apps:48,hires:2,cost:60},
{title:"採用担当",dept:"人事",channel:"紹介会社B",period:"2026/08–10",count:1,apps:24,hires:1,cost:90},
{title:"エンジニア",dept:"開発",channel:"求人媒体C",period:"2026/09–10",count:3,apps:72,hires:2,cost:120},
{title:"人材開発",dept:"人事",channel:"自社採用",period:"2026/07–09",count:1,apps:31,hires:1,cost:15}
];
let page="dashboard";
const content=document.getElementById("content");
const yen=n=>"¥"+n.toLocaleString("ja-JP");
function metrics(items){return `<div class="grid">${items.map(x=>`<div class="card"><div class="metric-label">${x[0]}</div><div class="metric">${x[1]}</div><div class="up">${x[2]}</div></div>`).join("")}</div>`}
function table(headers,rows){return `<div class="card tablewrap"><table><thead><tr>${headers.map(h=>`<th>${h}</th>`).join("")}</tr></thead><tbody>${rows.map(r=>`<tr>${r.map(v=>`<td>${v}</td>`).join("")}</tr>`).join("")}</tbody></table></div>`}
function dashboard(){return metrics([["在籍社員",employees.length+"名","全部署"],["募集中の求人",jobs.length+"件","求人管理に登録済み"],["応募数",jobs.reduce((a,j)=>a+j.apps,0)+"件","サンプル期間"],["採用実績",jobs.reduce((a,j)=>a+j.hires,0)+"名","サンプル期間"]])+`<div class="section-grid"><div class="card"><h2>採用チャネル別 応募数</h2>${jobs.map(j=>`<div class="barrow"><div class="barlabel"><span>${j.channel}</span><b>${j.apps}件</b></div><div class="bar"><div class="fill" style="width:${j.apps/72*100}%"></div></div></div>`).join("")}</div><div class="card"><h2>人事データ運用ルール</h2><p class="small">01　元データと更新日を残す</p><p class="small">02　不明な情報を推測で埋めない</p><p class="small">03　評価履歴は上書きせず保存</p><p class="small">04　数値の定義と集計条件を統一</p><p class="small">05　AIの抽出結果は人が確認</p></div></div><div class="card"><h2>最近の求人</h2>${table(["職種","部署","応募数","採用数","採用費"],jobs.map(j=>[j.title,j.dept,j.apps,j.hires,yen(j.cost*10000)]))}</div>`}
function jobsPage(){return `<div class="toolbar"><input id="jobTitle" placeholder="職種名"><input id="jobDept" placeholder="部署"><input id="jobApps" type="number" min="0" placeholder="応募数"><input id="jobHires" type="number" min="0" placeholder="採用数"><button onclick="addJob()">求人を追加</button></div>${table(["職種","部署","チャネル","掲載期間","応募数","採用数","採用費"],jobs.map(j=>[j.title,j.dept,j.channel,j.period,j.apps,j.hires,yen(j.cost*10000)]))}<p class="small">※求人票PDFのアップロードと履歴管理は今後の実装項目です。</p>`}
function recruitPage(){let apps=jobs.reduce((a,j)=>a+j.apps,0),hires=jobs.reduce((a,j)=>a+j.hires,0),cost=jobs.reduce((a,j)=>a+j.cost,0);return metrics([["応募数",apps+"件","登録済みサンプル"],["採用数",hires+"名","登録済みサンプル"],["採用費",yen(cost*10000),"サンプル合計"],["採用単価",yen(Math.round(cost*10000/hires)),"採用費 ÷ 採用数"]])+table(["チャネル","応募数","採用数","採用率","採用費"],jobs.map(j=>[j.channel,j.apps,j.hires,(j.hires/j.apps*100).toFixed(1)+"%",yen(j.cost*10000)])) +`<p class="small">応募から面接・内定までの詳細な歩留まりは、段階別データの追加後に集計できます。</p>`}
function peoplePage(){return `<div class="toolbar"><input id="personSearch" placeholder="氏名・部署で検索" oninput="filterPeople()"><button class="secondary" onclick="alert('評価履歴グラフは次の開発段階で追加します')">評価履歴について</button></div><div id="peopleTable">${peopleTable(employees)}</div><p class="small">給与の単位：万円／年。架空の社員データです。実データを登録する機能は未実装です。</p>`}
function peopleTable(list){return table(["社員ID","氏名","部署","役職","勤続年数","入社区分","最新評価"],list.map(e=>[e.id,e.name,e.dept,e.role,e.tenure,e.source,`<span class="pill">${e.rating}</span>`]))}
function retentionPage(){let depts=[...new Set(employees.map(e=>e.dept))];return `<div class="section-grid"><div class="card"><h2>部署別 人員構成</h2>${depts.map(d=>{let n=employees.filter(e=>e.dept===d).length;return `<div class="barrow"><div class="barlabel"><span>${d}</span><b>${n}名</b></div><div class="bar"><div class="fill" style="width:${n/employees.length*100}%"></div></div></div>`}).join("")}</div><div class="card"><h2>定着・離職分析の準備状況</h2><p class="small">退職日・在籍期間・退職理由を、確認済み事実と本人申告に分けて記録します。</p><p class="small">十分な履歴データが蓄積されるまでは、離職リスクの予測値を表示しません。</p><p class="small">個人の性格タイプだけで採用・評価を判断しない設計とします。</p></div></div>${table(["部署","在籍人数","平均勤続年数","最新評価A"],depts.map(d=>{let a=employees.filter(e=>e.dept===d);return [d,a.length,"デモ値",a.filter(e=>e.rating==="A").length+"名"]}))}`}
function aiPage(){return `<div class="card"><h2>メモ・求人情報を整理する</h2><p class="small">ここはAI連携前のデモです。入力内容を保存・送信せず、登録用の形式を画面上に作ります。</p><textarea id="rawText" rows="7" style="width:100%;margin:15px 0;padding:12px;border:1px solid var(--line);border-radius:8px" placeholder="例：営業を2人採用したい。求人媒体Aで先月30万円使って応募は20件。"></textarea><button onclick="structureText()">入力を整理する</button><div id="structured" style="margin-top:18px"></div></div>`}
function structureText(){const raw=document.getElementById("rawText").value.trim();if(!raw){alert("先にメモを入力してね");return}document.getElementById("structured").innerHTML=`<h2>登録用メモ（AI未接続・入力内容の確認用）</h2><div class="card"><b>元の入力</b><p style="margin-top:10px;white-space:pre-wrap">${raw.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")}</p><hr style="border:0;border-top:1px solid var(--line);margin:16px 0"><b>登録ステータス</b><p style="margin-top:8px">未解析・人による確認が必要</p><p class="small">実際のAI抽出は未実装。元情報を保持して、未確認項目を推測で補わない設計です。</p></div>`}
function addJob(){let title=document.getElementById("jobTitle").value.trim(),dept=document.getElementById("jobDept").value.trim();if(!title||!dept){alert("職種名と部署を入力してね");return}jobs.push({title,dept,channel:"未設定",period:"未設定",count:1,apps:Math.max(0,Number(document.getElementById("jobApps").value)||0),hires:Math.max(0,Number(document.getElementById("jobHires").value)||0),cost:0});render()}
function filterPeople(){let q=document.getElementById("personSearch").value.toLowerCase();document.getElementById("peopleTable").innerHTML=peopleTable(employees.filter(e=>(e.name+e.dept+e.id).toLowerCase().includes(q)))}
const pages={dashboard:["人事ダッシュボード","採用から定着・成長まで、組織の状態を見える化",dashboard],jobs:["求人管理","求人ごとの募集要件と採用成果を一元管理",jobsPage],recruit:["採用チャネル分析","チャネル別の成果・コスト・採用単価を比較",recruitPage],people:["社員データ","社員情報と評価データを構造化",peoplePage],retention:["組織・定着分析","組織構成と定着に関するデータを確認",retentionPage],ai:["AI入力センター","自由記述を登録しやすい形式に整える",aiPage]};
function render(){document.querySelectorAll(".nav").forEach(n=>n.classList.toggle("active",n.dataset.page===page));document.getElementById("title").textContent=pages[page][0];document.getElementById("subtitle").textContent=pages[page][1];content.innerHTML=pages[page][2]()}
document.querySelectorAll(".nav").forEach(n=>n.addEventListener("click",()=>{page=n.dataset.page;render()}));
render();
</script>
</body>
</html>
